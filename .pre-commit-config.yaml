repos:
  - repo: local
    hooks:
      # Nix formatting with alejandra
      - id: alejandra
        name: alejandra
        description: "Format Nix files with alejandra"
        entry: alejandra
        language: system
        files: '\.nix$'
        pass_filenames: true

      # Optional: Nix linting with statix
      - id: statix-check
        name: statix check
        description: "Lint Nix files with statix"
        # Lint only the staged files. `statix check` takes a single target, so
        # loop over them; linting the whole tree fails on warnings in files the
        # commit does not touch.
        entry: sh -c 'rc=0; for f in "$@"; do statix check "$f" || rc=1; done; exit $rc' --
        language: system
        files: '\.nix$'
        pass_filenames: true

      # Optional: Find dead Nix code
      - id: deadnix
        name: deadnix
        description: "Find unused Nix code"
        entry: deadnix --fail --no-lambda-pattern-names
        language: system
        files: '\.nix$'
        pass_filenames: true

  # Optional: Format other file types
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
